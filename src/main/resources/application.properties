# ===================================================================
# CONFIGURACIÓN DE LA APLICACIÓN TIENDA EFE
# ===================================================================
spring.application.name=tienda-efe
server.port=8080
spring.main.web-application-type=servlet

# ===================================================================
# CONEXIÓN A BASE DE DATOS MYSQL EN LA NUBE (Clever Cloud)
# Funciona en cualquier PC con conexión a internet sin instalar MySQL
# ===================================================================
spring.datasource.url=jdbc:mysql://b4kstwh7w39mgn088bob-mysql.services.clever-cloud.com:3306/b4kstwh7w39mgn088bob?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=ug01ilrlbiw764t1
spring.datasource.password=XlWbikl3AFbddyMklY8k
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Optimización de conexiones para plan gratuito Cloud (Límite: 5 conexiones)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

# ===================================================================
# HIBERNATE / JPA
# ddl-auto=update crea y actualiza las tablas automáticamente al arrancar
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===================================================================
# H2 CONSOLE (Disponible si entra en modo de respaldo en memoria)
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# THYMELEAF Y RECURSOS ESTÁTICOS
# ===================================================================
spring.thymeleaf.cache=false
spring.web.resources.static-locations=classpath:/static/
spring.jackson.serialization.fail-on-empty-beans=false

# ===================================================================
# DIAGNÓSTICO DETALLADO DE ERRORES HTTP
# ===================================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
server.error.include-stacktrace=always
